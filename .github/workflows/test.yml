name: PMAgents tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Member hygiene census
        run: python3 ci/member-hygiene.py
      - name: Hygiene falsifiability tests
        run: python3 ci/test-member-hygiene.py
      - name: Verify tracked manifest custody
        run: python3 ci/generate-manifest.py --check
      - name: Engine and frozen-baseline suites
        run: python3 -m unittest discover -s engine/tests -p 'test_*.py'
      - name: Guided zero-touch setup suite
        run: python3 -m unittest -v tests.test_zero_touch_setup
      - name: Manifest generator custody suite
        run: python3 -m unittest -v tests.test_manifest_generation
      - name: Every edition configurator suite
        run: |
          set -euo pipefail
          found=0
          for suite in editions/*/tests; do
            [ -d "$suite" ] || continue
            found=1
            python3 -m unittest discover -s "$suite" -p 'test_*.py' -v
          done
          test "$found" -eq 1
